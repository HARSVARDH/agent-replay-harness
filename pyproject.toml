[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-replay-harness"
version = "0.1.0"
description = "Deterministic Replay & Time-Travel Debugging Harness for Agent Workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Agentic Systems Engineer" }
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
agent-harness = "agent_replay_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_replay_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
