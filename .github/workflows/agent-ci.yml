name: Agent Reliability & Regression CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run Pytest Suite (Unit + Integration)
        run: |
          pytest -v

      - name: Run Chaos Engineering Resilience Matrix
        run: |
          agent-harness chaos --query "Analyze TSLA risk and filings"
